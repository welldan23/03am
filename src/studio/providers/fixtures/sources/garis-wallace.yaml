  - id: WAL-S1
    title: "Batas Biogeografi di Kepulauan Nusantara"
    publisher: "Jurnal Biogeografi (FIXTURE)"
    url: "https://fixture.03am.invalid/biogeografi/batas-nusantara"
    source_type: academic
    published_date: 2015-07-01
    authors: ["Tim Penulis (FIXTURE)"]
    origin: jurnal-biogeografi
    text: >-
      Garis Wallace adalah batas biogeografi yang memisahkan fauna khas Asia di sebelah barat
      dari fauna khas Australasia di sebelah timur. Di bagian selatan, garis ini melintas di
      antara Bali dan Lombok. Banyak peneliti kini memandang kawasan di antara kedua kelompok
      fauna itu sebagai zona peralihan yang disebut Wallacea, bukan sebagai satu garis tegas.

  - id: WAL-S2
