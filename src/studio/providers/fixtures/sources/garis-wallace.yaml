    publisher: "Museum Sejarah Alam (FIXTURE)"
    url: "https://fixture.03am.invalid/museum-alam/wallace-kepulauan-melayu"
    source_type: museum
    published_date: 2013-11-07
    authors: ["Tim Kurator (FIXTURE)"]
    origin: museum-alam
    text: >-
      Alfred Russel Wallace menjelajahi Kepulauan Melayu antara 1854 dan 1862. Dari
      pengamatannya, ia mencatat perbedaan tajam antara hewan di Bali dan di Lombok, meskipun
      kedua pulau itu hanya dipisahkan selat yang sempit.

  - id: WAL-S3
