    origin: pusat-oseanografi
    text: >-
      Selat Lombok cukup dalam sehingga tetap menjadi lautan bahkan ketika muka laut turun
      pada zaman es. Karena itu, hewan darat dari Asia dan Australasia tidak pernah terhubung
      oleh jembatan darat di titik ini.

