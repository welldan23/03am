  - id: KRK-S1
    title: "Kronologi Letusan Krakatau 1883: Tinjauan Vulkanologis"
    publisher: "Jurnal Vulkanologi Nusantara (FIXTURE)"
    url: "https://fixture.03am.invalid/krakatau/kronologi-vulkanologis"
    source_type: academic
    published_date: 2013-05-01
    authors: ["Tim Penulis (FIXTURE)"]
    origin: jvn
    text: >-
      Aktivitas Krakatau meningkat sejak Mei 1883. Puncak letusan terjadi pada 26 dan 27
      Agustus 1883, dengan ledakan terbesar pada pagi hari 27 Agustus. Gugusan Krakatau
      terletak di Selat Sunda, di antara Pulau Jawa dan Sumatra. Partikel dan aerosol yang
      terlempar ke stratosfer menyebabkan senja berwarna merah menyala yang teramati di banyak
      negara selama berbulan-bulan setelah letusan. Data pengamatan menunjukkan penurunan suhu
      rata-rata global pada tahun berikutnya. Tsunami yang dipicu letusan menjadi penyebab
      utama korban jiwa di pesisir Banten dan Lampung.

