    origin: arsip-kolonial
    text: >-
      Laporan resmi pemerintah kolonial mencatat 36.417 korban jiwa akibat bencana Krakatau.
      Sebagian besar korban tewas akibat gelombang tsunami yang melanda pesisir Banten dan
      Lampung pada 27 Agustus 1883. Arsip ini tidak mendukung angka korban di atas seratus
      ribu jiwa yang kemudian beredar dalam sejumlah tulisan populer.

