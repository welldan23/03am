# FIXTURE UJI: ekstraksi bukti mock, satu respons per sumber (varian = ID sumber).
# Kutipan HARUS persis ada di teks sumber; sistem memverifikasinya.
responses:
  KRK-S1:
    evidence:
      - {quote: "Aktivitas Krakatau meningkat sejak Mei 1883.", stance: supports, claim_key: krak-activity-may}
      - {quote: "Puncak letusan terjadi pada 26 dan 27 Agustus 1883, dengan ledakan terbesar pada pagi hari 27 Agustus.", stance: supports, claim_key: krak-peak-date}
      - {quote: "Gugusan Krakatau terletak di Selat Sunda, di antara Pulau Jawa dan Sumatra.", stance: supports, claim_key: krak-location}
      - {quote: "Partikel dan aerosol yang terlempar ke stratosfer menyebabkan senja berwarna merah menyala yang teramati di banyak negara selama berbulan-bulan setelah letusan.", stance: supports, claim_key: krak-sunsets}
      - {quote: "Data pengamatan menunjukkan penurunan suhu rata-rata global pada tahun berikutnya.", stance: supports, claim_key: krak-temperature}
      - {quote: "Tsunami yang dipicu letusan menjadi penyebab utama korban jiwa di pesisir Banten dan Lampung.", stance: supports, claim_key: krak-tsunami}
  KRK-S2:
    evidence:
      - {quote: "Laporan resmi pemerintah kolonial mencatat 36.417 korban jiwa akibat bencana Krakatau.", stance: supports, claim_key: krak-deaths}
