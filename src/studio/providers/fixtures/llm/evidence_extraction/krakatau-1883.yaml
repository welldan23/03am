  KRK-S3:
    evidence:
      - {quote: "Dentuman letusan Krakatau dilaporkan terdengar di Pulau Rodrigues, sekitar 4.800 kilometer dari sumbernya.", stance: supports, claim_key: krak-sound}
      - {quote: "Kabar letusan menyebar ke berbagai benua dalam hitungan jam melalui jaringan telegraf.", stance: supports, claim_key: krak-telegraph}
  KRK-S4:
    evidence:
      - {quote: "letusan Krakatau membuat senja berwarna merah menyala terlihat di banyak negara selama berbulan-bulan.", stance: supports, claim_key: krak-sunsets}
      - {quote: "Dentuman letusan juga dilaporkan terdengar di Pulau Rodrigues.", stance: supports, claim_key: krak-sound}
      - {quote: "Kabar letusan menyebar ke berbagai benua dalam hitungan jam melalui jaringan telegraf.", stance: supports, claim_key: krak-telegraph}
  KRK-S5:
