[project]
name = "studio-03am"
version = "0.1.0"
description = "03:AM — AI Documentary Studio (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "structlog>=24.4",
    "tzdata>=2024.2",
]

[project.scripts]
studio = "studio.interfaces.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket"
xfail_strict = true

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ", "PTH", "C4", "PIE", "RET"]
ignore = [
    "RUF001", # teks Bahasa Indonesia boleh memakai karakter seperti "–"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "DTZ001"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# --- import-linter ----------------------------------------------------------
[tool.importlinter]
root_package = "studio"

[[tool.importlinter.contracts]]
name = "Lapisan arsitektur modular monolith"
type = "layers"
layers = [
    "studio.interfaces",
    "studio.bootstrap",
    "studio.modules.workflow",
    "studio.modules.episodes | studio.modules.approvals | studio.modules.budget | studio.modules.artifacts",
    "studio.modules.audit",
    "studio.infra",
    "studio.shared",
]
